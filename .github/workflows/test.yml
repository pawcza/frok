name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v4
      - name: Install zsh, jq and Pillow
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh jq python3-pil
      - name: Run the tests
        run: zsh tests/run.sh
